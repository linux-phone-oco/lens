# This repository's mark: a lens - the grand view of the linux-phone-oco family.
schema = 1

[project]
id = "linux-phone-oco/lens"
name = "Linux Phones: phones running Linux, as good as Android - and how close we are"
title = "Linux Phones"
kind = "lens"
parent = "open-commons-observatory"

[exports]
glimpses = "linux-phone-oco/glimpses.json"
translations = "translations.json"
session_log = "session_log.json"

# What place this is, and what it gathers: every star of an owner (owner/*), or a star by name.
[place]
is = "constellation"
gathers = ["linux-phone-oco/*"]
